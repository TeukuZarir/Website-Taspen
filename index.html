<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#4f46e5" />
  <meta name="description" content="Aplikasi Absensi Magang Terintegrasi HadirKerja">
  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/9131/9131529.png">

  <title>HadirKerja</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
          },
        }
      }
    }
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', sans-serif;
    }
  </style>

  <link rel="stylesheet" href="/index.css">
</head>

<body class="bg-slate-50 dark:bg-slate-900 transition-colors duration-300">
  <div id="root">
    <div style="display:flex;justify-content:center;align-items:center;height:100vh;font-family:sans-serif;color:#666;">
      Loading Application...
    </div>
  </div>
  <div id="error-display"
    style="display:none; padding: 20px; background: #fee; border: 1px solid #f00; color: #c00; font-family: monospace; white-space: pre-wrap; margin: 20px;">
  </div>
  <script>
    window.onerror = function (message, source, lineno, colno, error) {
      var display = document.getElementById('error-display');
      display.style.display = 'block';
      display.innerText = 'Global Error:\n' + message + '\nAt: ' + source + ':' + lineno + ':' + colno;
      console.error(error);
    };
    window.addEventListener('unhandledrejection', function (event) {
      var display = document.getElementById('error-display');
      display.style.display = 'block';
      display.innerText += '\nUnhandled Promise Rejection:\n' + event.reason;
    });
  </script>
  <script type="module" src="/index.tsx"></script>
</body>

</html>
